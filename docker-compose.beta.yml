services:
  soc-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: soc-shift-manager:beta
    ports:
      - "4443:4443"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-jwt-secret-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@soc.local}
      - ADMIN_FORCE_RESET=${ADMIN_FORCE_RESET:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4443}
      - FLASK_ENV=production
      - PORT=4443
      - DATABASE_URL=sqlite:////app/instance/soc_shift_manager.db
      - START_COMMAND=gunicorn --bind 0.0.0.0:4443 --workers 2 --threads 4 --timeout 120 app:app
    volumes:
      - backend-data:/app/instance
    restart: unless-stopped

volumes:
  backend-data:
    driver: local
